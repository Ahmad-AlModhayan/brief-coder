name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Raised for notebooks (#3, #14). The read-only view took main.js to 122 KB (19.7 KB of it new);
      # 150 KiB leaves about 31 KB for notebook editing (#15). Running them (#16) needs its own decision.
      - name: Size budget (main.js under 150 KiB)
        run: node -e "const s=require('fs').statSync('main.js').size; console.log('main.js', s, 'bytes'); if (s > 153600) process.exit(1)"
      - run: npm run test:unit
