name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Size budget (main.js under 100 KiB)
        run: node -e "const s=require('fs').statSync('main.js').size; console.log('main.js', s, 'bytes'); if (s > 102400) process.exit(1)"
      - run: npm run test:unit
