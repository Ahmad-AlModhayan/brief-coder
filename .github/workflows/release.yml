name: Release

# Publishes a release whenever main has a version (in manifest.json) that isn't released yet.
# To ship a new version: `npm version patch` (or minor/major), update .github/RELEASE_NOTES.md,
# and push to main. The release gets the three files Obsidian and BRAT need, plus the agent bridge
# (coder-bridge.mjs), which runs outside Obsidian and is downloaded on its own.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: echo "value=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check whether it is already released
        id: released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.value }}" > /dev/null 2>&1; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.released.outputs.yes == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Build and test
        if: steps.released.outputs.yes == 'false'
        run: |
          npm ci
          npm run build
          npm run test:unit

      - name: Create the release
        if: steps.released.outputs.yes == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.value }}" main.js manifest.json styles.css bridge/coder-bridge.mjs \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.value }}" \
            --notes-file .github/RELEASE_NOTES.md
